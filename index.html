<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>VS RACING SIMULATOR</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--r:#ff1e2d;--bg:#0a0a0f;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Arial,sans-serif}
canvas{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;background:linear-gradient(#000b,#0006 50%,#000c);z-index:5;text-align:center;overflow:auto}
.scr.on{display:flex}
h1{margin:0;font-style:italic;font-size:clamp(20px,6vw,38px);letter-spacing:2px;text-shadow:0 0 14px var(--r)}
h1 b{color:var(--r)}
.logo{width:min(80vw,420px);filter:drop-shadow(0 0 18px #f00a)}
.btn{background:linear-gradient(135deg,#ff1e2d,#a00010);color:#fff;border:2px solid #fff3;border-radius:14px;padding:14px 30px;font:800 20px 'Segoe UI',Arial;letter-spacing:2px;font-style:italic;box-shadow:0 0 18px #f003;min-width:230px}
.btn.g{background:#1b1e27;box-shadow:none}.btn:active{transform:scale(.96)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px}
.card{background:#12141bdd;border:2px solid #ffffff22;border-radius:14px;padding:10px;width:min(44vw,210px)}
.card.sel{border-color:var(--r);box-shadow:0 0 14px #f004}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.card small{display:block;opacity:.7}
.card button{margin-top:6px;width:100%;padding:8px;border-radius:8px;border:0;background:var(--r);color:#fff;font-weight:800}
.card button.o{background:#2a8f3a}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:3;padding-top:env(safe-area-inset-top,0px)}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;font-weight:700;text-shadow:0 2px 4px #000}
#top div{background:#000a;border:1px solid #fff2;border-radius:10px;padding:4px 10px;font-size:11px;letter-spacing:1px}
#top b{display:block;font-size:20px}
#sc{text-align:center;border-color:var(--r)!important}
.bar{height:7px;background:#0008;border-radius:4px;margin:0 10px 4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--r)}
#fb i{background:#ffc400}
#bot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px))}
#spd{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--r) calc(var(--p)*1%),#222 0);display:grid;place-items:center;position:relative}
#spd::after{content:"";position:absolute;inset:9px;background:#0b0c10;border-radius:50%}
#spd div{position:relative;z-index:1;text-align:center;font-size:10px}#spd b{display:block;font-size:30px;line-height:1}
#spd s{position:absolute;z-index:1;font-size:8px;text-decoration:none;bottom:7px;left:12px;opacity:.6;text-shadow:none}#spd s+s{left:auto;right:6px}
.cb{pointer-events:auto;border-radius:50%;border:3px solid #fff5;background:#000a;color:#fff;font-weight:800;width:62px;height:62px;font-size:11px}
.cb.big{width:74px;height:74px;font-size:12px;background:#b00018}
.cb.bo{background:#c76a00}.cb:active,.cb.dn{background:#fff3;transform:scale(.93)}
#ctr{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
#rg{display:flex;flex-direction:column;gap:8px;align-items:center}
#rec{pointer-events:auto;position:absolute;right:10px;top:84px;background:#000a;color:#fff;border:1px solid #fff4;border-radius:8px;padding:5px 9px;font-size:11px}
#ann{position:fixed;top:30%;left:0;right:0;text-align:center;font:900 28px Arial;font-style:italic;color:#ffd400;text-shadow:0 0 12px #000;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s}
#rv{position:fixed;inset:0;background:#000d;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}#rv video{width:90%;max-height:70%}
</style></head><body>
